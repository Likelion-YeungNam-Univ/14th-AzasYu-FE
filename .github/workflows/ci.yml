name: Continuous Integration 

on:
  pull_request: 
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      # 코드 checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # Node.js 설정
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20" # Vite + React 권장 Node 버전

      # 의존성 설치
      - name: Install dependencies
        run: npm install

      # 빌드
      - name: Build Vite app
        run: npm run build